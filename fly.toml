app = "stockscreen-janco"
primary_region = "ams"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Sinds 2026-11-07 slaapt de machine als er geen verkeer is (was: altijd aan,
  # $3,96/mnd). De scheduler draait nog steeds in het proces; een externe wekker
  # (cron-job.org) vraagt elke minuut /api/health op in de uren 3, 4, 18 en 19
  # Amsterdam, zodat de machine wakker blijft tijdens de rondes.
  # Valt de wekker uit, dan haalt de eerstvolgende start het werk in
  # (`_ran_today` in _scheduler_loop). Zie CLAUDE.md.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  # 512MB sinds 2026-08-01. Op 256MB raakte de app in een OOM-crashloop zodra
  # het universum naar 2.759 tickers ging: pandas + yfinance kosten al ~100MB
  # en een dashboardrespons over dat aantal rijen paste er niet meer bij.
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
