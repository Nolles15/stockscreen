app = "stockscreen-janco"
primary_region = "ams"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Sinds 2026-11-07 slaapt de machine als er niets te doen is (was: altijd aan,
  # $3,96/mnd). Fly's auto_stop staat bewust UIT: die stopte op 7 nov een
  # koersronde halverwege, ondanks een ping per minuut. De app stopt zichzelf
  # (engine/stilte.py): na 10 min zonder verzoek én zonder lopende ronde.
  # Exitcode 0 + restartbeleid on-failure = machine blijft uit; auto_start
  # wekt hem bij het volgende verzoek. De wekker (cron-job.org) vraagt elke
  # minuut /api/health op in de uren 3, 4, 18 en 19 Amsterdam. Zie CLAUDE.md.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  # 512MB sinds 2026-08-01. Op 256MB raakte de app in een OOM-crashloop zodra
  # het universum naar 2.759 tickers ging: pandas + yfinance kosten al ~100MB
  # en een dashboardrespons over dat aantal rijen paste er niet meer bij.
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
