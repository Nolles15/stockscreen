app = "stockscreen-janco"
primary_region = "ams"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  # 512MB sinds 2026-08-01. Op 256MB raakte de app in een OOM-crashloop zodra
  # het universum naar 2.759 tickers ging: pandas + yfinance kosten al ~100MB
  # en een dashboardrespons over dat aantal rijen paste er niet meer bij.
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
