<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Stockscreener{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ─── Design tokens (zelfde als aandelenanalyse) ─── */
    :root {
      --bg:          #EEEEED;
      --surface:     #FFFFFF;
      --surface-2:   #E9E9E7;
      --text-1:      #0A0A0A;
      --text-2:      #555555;
      --text-3:      #999999;
      --border:      #E2E2E0;
      --buy:         #166534;
      --buy-bg:      #F0FDF4;
      --buy-border:  #BBF7D0;
      --hold:        #854D0E;
      --hold-bg:     #FFFBEB;
      --hold-border: #FDE68A;
      --pass:        #991B1B;
      --pass-bg:     #FEF2F2;
      --pass-border: #FECACA;
      --radius:      16px;
      --radius-sm:   10px;
      /* Hoogte van de bovenbalk. Op mobiel zakken de paginalinks naar een
         tweede regel, dus daar is hij hoger. Sticky elementen op de
         pagina's (zoals de sectienav van een analyse) plakken hieraan
         vast via var(--nav-h) — niet met een eigen 64px. */
      --nav-h:       64px;
      --shadow:      0 1px 2px rgba(0,0,0,0.04), 0 4px 14px rgba(0,0,0,0.04);
      --font:        'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: var(--font) !important; -webkit-font-smoothing: antialiased; }

    /* ─── Tailwind kleur-overrides (dark → cream) ─── */
    body,
    .bg-slate-950 { background-color: var(--bg) !important; color: var(--text-1) !important; }
    .bg-slate-900 { background-color: var(--surface) !important; }
    .bg-slate-800 { background-color: var(--surface-2) !important; }
    .bg-slate-700 { background-color: #D5D5D3 !important; }

    .text-white,
    .text-slate-100,
    .text-slate-200,
    .text-slate-300 { color: var(--text-1) !important; }
    .text-slate-400  { color: var(--text-2) !important; }
    .text-slate-500,
    .text-slate-600  { color: var(--text-3) !important; }

    .border-slate-800,
    .border-slate-700 { border-color: var(--border) !important; }

    .divide-y > * + * { border-color: var(--border) !important; }

    /* hover op tabel-rijen */
    tr:hover { background-color: #F5F5F3 !important; }
    .hover\:bg-slate-800:hover,
    .hover\:bg-slate-600:hover { background-color: var(--surface-2) !important; color: var(--text-1) !important; }

    /* sortable header hover */
    .sortable:hover { background-color: var(--surface-2) !important; }

    /* inputs & selects */
    input, select, textarea {
      font-family: var(--font) !important;
      background-color: var(--surface) !important;
      color: var(--text-1) !important;
      border-color: var(--border) !important;
    }
    input::placeholder, textarea::placeholder { color: var(--text-3) !important; }
    input:focus, select:focus, textarea:focus {
      outline: none !important;
      box-shadow: 0 0 0 2px var(--text-1) !important;
      border-color: var(--text-1) !important;
    }

    /* knoppen */
    .bg-blue-600 { background-color: var(--text-1) !important; color: #fff !important; }
    .bg-blue-600:hover, .hover\:bg-blue-500:hover { background-color: #333 !important; }

    /* thead */
    thead { background-color: var(--surface-2) !important; }
    thead th { color: var(--text-3) !important; }

    /* tabel */
    table { border-collapse: collapse; }
    .overflow-x-auto.rounded-xl { border-color: var(--border) !important; background: var(--surface) !important; }

    /* modals */
    .bg-black\/70 { background-color: rgba(0,0,0,0.5) !important; }

    /* signals — zelfde kleuren als aandelenanalyse */
    .signal-STRONG\ BUY {
      background: var(--text-1); color: #fff;
      padding: 2px 10px; border-radius: 20px; font-weight: 700; font-size: 11px; letter-spacing: 0.3px;
    }
    .signal-BUY {
      background: var(--buy-bg); color: var(--buy);
      border: 1px solid var(--buy-border);
      padding: 2px 10px; border-radius: 20px; font-weight: 700; font-size: 11px;
    }
    .signal-HOLD {
      background: var(--hold-bg); color: var(--hold);
      border: 1px solid var(--hold-border);
      padding: 2px 10px; border-radius: 20px; font-weight: 700; font-size: 11px;
    }
    .signal-SELL,
    .signal-N\/A,
    .signal-ERROR,
    .signal-INSUFFICIENT\ DATA {
      background: var(--pass-bg); color: var(--pass);
      border: 1px solid var(--pass-border);
      padding: 2px 10px; border-radius: 20px; font-weight: 700; font-size: 11px;
    }

    /* reden-labels: waarom geen signaal (Plan 2) — 3 onderscheidende kleuren
       i.p.v. één generiek-rood INSUFFICIENT DATA */
    .signal-reason-geen_data {            /* grijs — data ontbreekt/onbruikbaar */
      background: #F1F5F9; color: #475569; border: 1px solid #CBD5E1;
      padding: 2px 10px; border-radius: 20px; font-weight: 700; font-size: 11px;
    }
    .signal-reason-databug {              /* paars — schaal/eenheid-bug */
      background: #F5F3FF; color: #6D28D9; border: 1px solid #DDD6FE;
      padding: 2px 10px; border-radius: 20px; font-weight: 700; font-size: 11px;
    }
    .signal-reason-geen_fv {              /* oranje — verlieslatend, geen FV */
      background: #FFF7ED; color: #C2410C; border: 1px solid #FED7AA;
      padding: 2px 10px; border-radius: 20px; font-weight: 700; font-size: 11px;
    }
    .signal-reason-verouderd {            /* amber — jaarcijfers lopen achter */
      background: #FEFCE8; color: #A16207; border: 1px solid #FDE68A;
      padding: 2px 10px; border-radius: 20px; font-weight: 700; font-size: 11px;
    }

    /* sort indicators */
    .sort-asc::after  { content: ' ↑'; color: var(--text-1); }
    .sort-desc::after { content: ' ↓'; color: var(--text-1); }
    th { white-space: nowrap; }
    .sortable { cursor: pointer; user-select: none; }

    /* ─── NAVIGATIE ─── */
    #main-nav {
      background: rgba(255,255,255,0.94);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(12px);
    }
    .nav-inner {
      max-width: 1320px; margin: 0 auto;
      padding: 0 32px;
      display: flex; align-items: stretch; gap: 0;
      height: var(--nav-h);
    }
    .nav-brand {
      display: flex; align-items: center; gap: 12px;
      padding-right: 32px;
      border-right: 1px solid var(--border);
      text-decoration: none;
    }
    .nav-brand-icon {
      width: 36px; height: 36px; border-radius: 8px;
      background: var(--text-1); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 800; flex-shrink: 0;
    }
    .nav-brand-label { font-size: 14px; font-weight: 700; color: var(--text-1); letter-spacing: -0.2px; }
    .nav-brand-sub   { font-size: 11px; color: var(--text-3); }

    /* tool-tabs */
    .nav-tabs { display: flex; align-items: stretch; gap: 0; }
    .nav-tab {
      display: flex; align-items: center;
      padding: 0 20px;
      font-size: 13px; font-weight: 600;
      color: var(--text-3);
      text-decoration: none;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .nav-tab:hover { color: var(--text-1); }
    .nav-tab.active { color: var(--text-1); border-bottom-color: var(--text-1); }
    .nav-tab.external::after { content: ' ↗'; font-size: 10px; opacity: 0.5; }

    /* intern nav (Dashboard / Settings / Log) */
    .nav-internal {
      display: flex; align-items: stretch;
      border-left: 1px solid var(--border);
      margin-left: 16px; padding-left: 16px; gap: 0;
    }
    .nav-internal a {
      display: flex; align-items: center;
      /* 10px i.p.v. 14px sinds de zevende link (Tussenchecks): met 14px
         liep de balk over op 1024px-schermen. */
      padding: 0 10px;
      font-size: 12px; font-weight: 600; color: var(--text-3);
      text-decoration: none;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .nav-internal a:hover { color: var(--text-1); }
    .nav-internal a.active { color: var(--text-1); border-bottom-color: var(--text-1); }

    /* refresh rechts */
    .nav-actions { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .btn-refresh {
      background: var(--text-1); color: #fff;
      font-family: var(--font); font-size: 13px; font-weight: 600;
      padding: 7px 16px; border-radius: 8px; border: none;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-refresh:hover:not(:disabled) { background: #333; }
    .btn-refresh:disabled { opacity: 0.5; cursor: not-allowed; }
    #refresh-status { font-size: 12px; color: var(--text-3); }

    /* ─── NAVIGATIE OP SMALLE SCHERMEN ─────────────────────────────────
       De balk heeft op één regel ruim 1000px nodig (merk + tabs + zeven
       paginalinks + refreshknop). Op een telefoon liep vrijwel alles
       buiten beeld. Vanaf hier: merk en refreshknop op de eerste regel,
       de paginalinks op een tweede regel die horizontaal scrollt. */
    @media (max-width: 900px) {
      :root { --nav-h: 108px; }

      .nav-inner {
        flex-wrap: wrap;
        align-items: center;
        padding: 0 16px;
      }

      .nav-brand {
        height: 60px;
        padding-right: 16px;
        border-right: none;
      }

      /* Eén tool-tab ("Screener") die naar dezelfde plek wijst als het
         merk-logo — op mobiel puur ruimteverlies. */
      .nav-tabs { display: none; }

      .nav-actions { height: 60px; }

      .nav-internal {
        order: 3;
        width: 100%;
        height: 48px;
        margin-left: 0; padding-left: 0;
        border-left: none;
        border-top: 1px solid var(--border);
        overflow-x: auto;
        scrollbar-width: none;              /* Firefox */
        -webkit-overflow-scrolling: touch;
      }
      .nav-internal::-webkit-scrollbar { display: none; }
      .nav-internal a {
        padding: 0 12px;
        flex-shrink: 0;                     /* niet samenpersen, laat scrollen */
        font-size: 13px;
      }
      /* De actieve link in beeld brengen, anders lijkt de rij leeg te
         beginnen op pagina's verderop in het menu. */
      .nav-internal a.active { scroll-margin-left: 16px; }
    }

    @media (max-width: 420px) {
      /* Op de smalste telefoons kost de merktekst te veel breedte. */
      .nav-brand-label, .nav-brand-sub { display: none; }
      .btn-refresh { padding: 7px 12px; font-size: 12px; }
    }
  </style>
</head>
<body>

  <!-- Nav -->
  <nav id="main-nav">
    <div class="nav-inner">
      <!-- Brand -->
      <a class="nav-brand" href="/">
        <div class="nav-brand-icon">S</div>
        <div>
          <div class="nav-brand-label">Aandelentools</div>
          <div class="nav-brand-sub">Nolles</div>
        </div>
      </a>

      <!-- Tool-tabs -->
      <div class="nav-tabs">
        <a class="nav-tab active" href="/">Screener</a>
      </div>

      <!-- Intern sub-nav -->
      <div class="nav-internal">
        <a href="/" {% if request.path == '/' %}class="active"{% endif %}>Dashboard</a>
        <a href="/triage" {% if request.path == '/triage' %}class="active"{% endif %}>Triage</a>
        <a href="/analyses" {% if request.path.startswith('/analyses') %}class="active"{% endif %}>Analyses</a>
        <a href="/tussenchecks" {% if request.path.startswith('/tussenchecks') %}class="active"{% endif %}>Tussenchecks</a>
        <a href="/methode" {% if request.path == '/methode' %}class="active"{% endif %}>Methode</a>
        <a href="/settings" {% if request.path == '/settings' %}class="active"{% endif %}>Instellingen</a>
        <a href="/log" {% if request.path == '/log' %}class="active"{% endif %}>Geschiedenis</a>
      </div>

      <!-- Refresh -->
      <div class="nav-actions">
        <span id="refresh-status"></span>
        <button id="btn-refresh" class="btn-refresh" onclick="startRefresh()">↻ Refresh</button>
      </div>
    </div>
  </nav>

  <!-- Versheidsbanner: maakt stilstand van de verversing onmiddellijk zichtbaar.
       Eerder kon de refresh weken stilliggen zonder dat het scherm iets liet
       merken; de cijfers zagen er dan nog steeds normaal uit. -->
  <div id="health-banner" style="display:none; max-width:1320px; margin:16px auto 0; padding:10px 16px;
       border-radius:8px; font-size:13px; align-items:center; gap:10px;"></div>

  <!-- Content -->
  <main style="max-width:1320px; margin:0 auto; padding:32px;">
    {% block content %}{% endblock %}
  </main>

  <script>
  let _refreshPoll = null;

  async function startRefresh(tickers) {
    const btn = document.getElementById('btn-refresh');
    const status = document.getElementById('refresh-status');
    btn.disabled = true;
    btn.textContent = '⏳ Bezig…';
    status.textContent = 'Ophalen gegevens…';

    try {
      const body = tickers ? { tickers } : { force: true };
      const res  = await fetch('/api/refresh', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const { job_id } = await res.json();
      _pollRefresh(job_id);
    } catch(e) {
      status.textContent = 'Fout: ' + e.message;
      btn.disabled = false;
      btn.textContent = '↻ Refresh';
    }
  }

  function _pollRefresh(jobId) {
    if (_refreshPoll) clearInterval(_refreshPoll);
    _refreshPoll = setInterval(async () => {
      const res = await fetch('/api/refresh/status?job_id=' + jobId);
      const btn = document.getElementById('btn-refresh');
      const status = document.getElementById('refresh-status');
      if (!res.ok) {
        clearInterval(_refreshPoll);
        btn.disabled = false;
        btn.textContent = '↻ Refresh';
        status.textContent = 'Verbinding verbroken';
        return;
      }
      const job = await res.json();
      status.textContent = `${job.current || ''} (${job.progress || 0}%)`;
      if (job.status === 'done') {
        clearInterval(_refreshPoll);
        btn.disabled = false;
        btn.textContent = '↻ Refresh';
        const errCount = Object.keys(job.errors || {}).length;
        status.textContent = errCount > 0 ? `✓ Klaar — ${errCount} waarschuwing(en)` : '✓ Klaar';
        if (typeof onRefreshDone === 'function') onRefreshDone(job);
      }
    }, 1500);
  }

  function fmt(val, decimals=2, suffix='') {
    if (val === null || val === undefined) return '—';
    return Number(val).toFixed(decimals) + suffix;
  }
  // Map valutacode → symbool. Onbekende codes vallen terug op de code zelf (bv. 'PLN ').
  const CURRENCY_SYMBOLS = {
    EUR: '€', USD: '$', GBP: '£', GBp: 'p', JPY: '¥', CHF: 'CHF ',
    SEK: 'kr ', NOK: 'kr ', DKK: 'kr ', PLN: 'zł ', CAD: 'C$', AUD: 'A$',
    HKD: 'HK$', SGD: 'S$', INR: '₹', CNY: '¥', KRW: '₩', TWD: 'NT$',
    BRL: 'R$', MXN: 'Mex$', ZAR: 'R ', TRY: '₺', ILS: '₪',
  };
  function currencySymbol(ccy) {
    if (!ccy) return '';
    return CURRENCY_SYMBOLS[ccy] || (ccy + ' ');
  }
  function fmtMoney(val, currency='EUR', decimals=2) {
    if (val === null || val === undefined) return '—';
    return currencySymbol(currency) + Number(val).toFixed(decimals);
  }
  function fmtBig(valM) {
    if (valM === null || valM === undefined) return '—';
    if (Math.abs(valM) >= 1000) return (valM / 1000).toFixed(2) + 'B';
    return Math.round(valM) + 'M';
  }
  function fmtBigMoney(valM, currency='EUR') {
    if (valM === null || valM === undefined) return '—';
    return currencySymbol(currency) + fmtBig(valM);
  }

  // Versheidsbanner. Toont alleen iets als er aandacht nodig is, behalve op het
  // dashboard waar ook de "alles is bij" bevestiging waarde heeft.
  function renderHealthBanner(h) {
    const el = document.getElementById('health-banner');
    if (!el) return;

    const age = h.price_age_hours;
    let level, text;

    if (!h.scheduler_alive) {
      level = 'rood';
      text = '⚠ De automatische verversing draait niet. Koersen en cijfers worden niet bijgewerkt.';
    } else if (age === null || age === undefined) {
      level = 'geel';
      text = 'Koersen zijn nog niet automatisch ververst — de eerste ronde moet nog draaien.';
    } else if (age > 48) {
      level = 'rood';
      text = `⚠ Koersen zijn ${Math.round(age / 24)} dagen oud. Er gaat iets mis met de verversing.`;
    } else if (age > 24) {
      level = 'geel';
      text = `Koersen zijn ${Math.round(age)} uur oud — de laatste ronde is overgeslagen.`;
    } else {
      const when = new Date(h.last_price_refresh).toLocaleString('nl-NL',
        { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      level = 'groen';
      text = `Koersen bijgewerkt: ${when} · ${h.prices_fresh_24h_pct}% van de aandelen vers`;
    }

    if (h.storm_last_7d > 0 && level === 'groen') {
      level = 'geel';
      text += ` · ${h.storm_last_7d}× een storing bij de databron deze week (opgevangen)`;
    }

    const stijl = {
      groen: ['#0d3320', '#1a7f4b', '#7ee2a8'],
      geel:  ['#3a2f0b', '#8a6d1a', '#f0d068'],
      rood:  ['#3a1417', '#8c2f36', '#f3a0a6'],
    }[level];

    el.style.background = stijl[0];
    el.style.border = '1px solid ' + stijl[1];
    el.style.color = stijl[2];
    el.textContent = text;
    el.style.display = 'flex';
  }

  fetch('/api/health')
    .then(r => r.ok ? r.json() : null)
    .then(h => { if (h) { window._health = h; renderHealthBanner(h);
                          document.dispatchEvent(new CustomEvent('health-loaded', { detail: h })); } })
    .catch(() => {});
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
