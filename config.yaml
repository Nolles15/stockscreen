app:
  port: 5001
  name: Stockscreener
  auto_refresh_on_startup: false
  new_ticker_days: 7

refresh:
  # Aantal tickers waarvan per nacht de jaarcijfers worden opgehaald. Koersen
  # gaan in bulk en zijn niet aan dit getal gebonden. Jaarcijfers veranderen
  # hooguit per kwartaal, dus een volledige ronde mag gerust weken duren.
  #
  # Verhoogd van 100 naar 250 toen het universum in augustus 2026 groeide van
  # 913 naar ~2.760 tickers. Met 100 per nacht duurt één ronde 28 dagen en zou
  # de inhaalslag voor de 2.000 nieuwe tickers 20 nachten kosten; met 250 is
  # dat 11 nachten en blijft een volledige ronde op 11 dagen. Hoger durven we
  # niet: elke ticker is een losse Yahoo-aanroep en boven dit tempo lopen we
  # tegen rate-limits aan (de storm-guard vangt dat wel op, maar dan staat de
  # verversing alsnog stil).
  fundamentals_per_night: 250

screening:
  min_quality_score: 7
  required_years: 3
  growth_lossmaker_cagr: 0.15   # >= deze 3-jaars omzet-CAGR markeert een verlieslatende groeier (🌱) op het dashboard
signals:
  # Drempels als percentage van de fair value. Een koopsignaal bij 70% komt neer
  # op een veiligheidsmarge van 30%; samen met de kwaliteitseis (score >= 7) levert
  # dat een korte lijst op. Dat de koopsignalen daarmee onder de nagestreefde 5%
  # blijven is een echte uitkomst en geen instelfout: er zijn nu eenmaal weinig
  # aandelen die tegelijk een fatsoenlijk bedrijf zijn en fors afgeprijsd. Verlaag
  # de kwaliteitseis niet om het quotum te halen - gebruik de ranglijst (rank_score)
  # om te bepalen wat aandacht verdient.
  strong_buy_pct: 50
  buy_pct: 70
  hold_upper_pct: 115
  sell_pct: 130
  sell_pct_high_quality: 175   # compounders (quality >= 9) pas SELL bij 175% van FV
  sell_quality_floor: 6
valuation:
  multiples_weight: 0.6
  dcf_weight: 0.4
  outlier_iqr_multiplier: 3.0
  default_required_return: 10
  max_growth_rate: 8
  max_perpetuity_growth: 5
  # Rente op AAA-bedrijfsobligaties, gebruikt om de Graham-formule te herschalen
  # naar het huidige renteniveau (Graham ijkte op 4,4% in 1962). Dit is expres een
  # obligatierente en niet de rendementseis op aandelen: die laatste bevat al een
  # risico-opslag die ook in de multiples en de DCF zit, en dubbel tellen drukte
  # de waarderingen structureel omlaag. Bijstellen als de rente structureel wijzigt.
  bond_yield: 5.0
# De sleutels hieronder MOETEN exact de sectornamen zijn die Yahoo teruggeeft
# (`stocks.sector`), niet de GICS-namen. Yahoo zegt "Consumer Cyclical",
# "Consumer Defensive" en "Basic Materials" waar GICS "Consumer Discretionary",
# "Consumer Staples" en "Materials" zegt. Stonden hier tot 2026-08-06 de
# GICS-namen: 617 aandelen (22%) vielen daardoor stil terug op Default, en bij
# Basic Materials was Default 20% royaler dan het eigen profiel — dat blaast de
# fair value op en levert schijnkortingen. Een naam die nergens op matcht geeft
# geen foutmelding, alleen een stille terugval. Bewaakt door
# tests/test_sector_config.py.
sectors:
  Technology:
    growth_base: 6
    growth_min: 4
    growth_max: 8
    required_return: 11
    pe: 25
    ev_ebitda: 16
    pb: 5
    ev_fcf: 22
  Financial Services:
    growth_base: 4
    growth_min: 2
    growth_max: 6
    required_return: 10
    pe: 12
    ev_ebitda: 8
    pb: 1.4
    ev_fcf: 14
  Healthcare:
    growth_base: 5
    growth_min: 3
    growth_max: 7
    required_return: 10
    pe: 20
    ev_ebitda: 13
    pb: 3.5
    ev_fcf: 20
  Consumer Defensive:   # GICS: Consumer Staples
    growth_base: 3
    growth_min: 2
    growth_max: 5
    required_return: 9
    pe: 18
    ev_ebitda: 12
    pb: 3
    ev_fcf: 18
  Consumer Cyclical:    # GICS: Consumer Discretionary
    growth_base: 5
    growth_min: 3
    growth_max: 7
    required_return: 11
    pe: 20
    ev_ebitda: 12
    pb: 3
    ev_fcf: 18
  Industrials:
    growth_base: 4
    growth_min: 2
    growth_max: 6
    required_return: 10
    pe: 18
    ev_ebitda: 11
    pb: 2.5
    ev_fcf: 16
  Energy:
    growth_base: 3
    growth_min: 1
    growth_max: 5
    required_return: 11
    pe: 14
    ev_ebitda: 8
    pb: 1.8
    ev_fcf: 12
  Basic Materials:      # GICS: Materials
    growth_base: 3
    growth_min: 1
    growth_max: 5
    required_return: 10
    pe: 15
    ev_ebitda: 9
    pb: 2
    ev_fcf: 14
  Utilities:
    growth_base: 2
    growth_min: 1
    growth_max: 3
    required_return: 9
    pe: 16
    ev_ebitda: 10
    pb: 1.5
    ev_fcf: 15
  Real Estate:
    growth_base: 3
    growth_min: 2
    growth_max: 5
    required_return: 9
    pe: 20
    ev_ebitda: 15
    pb: 1.8
    ev_fcf: 20
  # Afgeleid op 2026-08-06 uit het eigen universum (152 tickers), niet uit een
  # externe bron. Methode: de bestaande profielen staan op ongeveer 1,45x de
  # historische mediaan van hun eigen sector (Technology 1,42 · Utilities 1,43 ·
  # Consumer Defensive 1,45 · Industrials 1,78 · Energy 1,87). De mediane K/W
  # van deze sector is 12,8 → 12,8 x 1,45 = 18,5, en EV/EBITDA 5,1 → 10,6.
  # Hier staat het net iets strenger omdat 72% van de sector telecom of media
  # is; games en platforms zitten hoger maar zijn de minderheid.
  #
  # LET OP de spreiding: telecom noteert op K/W 11,4 en interactief op 16,5.
  # Geen enkel sectorgetal klopt voor allebei. Dat het toch beperkt schaadt,
  # komt doordat de fair value voor 65% op de eigen historie van het aandeel
  # leunt en maar voor 35% op dit anker.
  Communication Services:
    growth_base: 3
    growth_min: 1
    growth_max: 5
    required_return: 10
    pe: 17
    ev_ebitda: 10
    pb: 2.0
    ev_fcf: 15
  Default:
    growth_base: 4
    growth_min: 2
    growth_max: 6
    required_return: 10
    pe: 18
    ev_ebitda: 11
    pb: 2.5
    ev_fcf: 16
